<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Blade Barbershop - Enquiry</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>The Blade Barbershop</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="enquiry.html" class="active">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Service Enquiry & Booking Request</h2>
            <p>Have questions about our services or need to enquire about a private group booking? Send us a message using the form below.</p>
            
            <form action="#" method="post">
                <div class="form-group">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="service">Service of Interest:</label>
                    <select id="service" name="service">
                        <option value="haircut">Classic Haircut</option>
                        <option value="shave">A Fade & Style</option>
                        <option value="beard">Beard Trim</option>
                        <option value="package">Haircut & Beard Trim Package</option>
                        <option value="general">General Enquiry</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Enquiry Details:</label>
                    <textarea id="message" name="message" required></textarea>
                </div>

                <button type="submit" class="btn">Submit Enquiry</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 The Blade Barbershop. All rights reserved.</p>
    </footer>

</body>
</html>
